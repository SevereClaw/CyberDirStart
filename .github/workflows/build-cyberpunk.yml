name: Build WinDirStat (Cyberpunk)

# Every push builds the exe (downloadable from the run's Artifacts).
# A release (GitHub Release page with zip files) is published when:
#   - a tag like v1.0 is pushed, or
#   - Actions -> "Build WinDirStat (Cyberpunk)" -> Run workflow is started with a version filled in.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, e.g. v1.0 (leave empty to only build)'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v3

      - name: Build
        shell: cmd
        run: msbuild windirstat.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /t:windirstat

      - uses: actions/upload-artifact@v7
        with:
          name: WinDirStat-Cyberpunk-${{ matrix.platform }}
          path: build/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Package zips
        run: |
          mkdir -p release
          for platform in x64 Win32; do
            dir="dist/WinDirStat-Cyberpunk-$platform"
            cp LICENSE.md "$dir/"
            (cd "$dir" && zip -9 -r "../../release/CyberDirStat-${TAG}-$platform.zip" .)
          done
          ls -la release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the tag on the built commit if it does not exist yet
          gh release create "$TAG" release/*.zip \
            --target "$GITHUB_SHA" \
            --title "CyberDirStat $TAG" \
            --generate-notes
