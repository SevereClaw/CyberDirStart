name: Build WinDirStat (Cyberpunk)

# Every push builds the exe (downloadable from the run's Artifacts).
# A release (GitHub Release page with zip files) is published when:
#   - a tag like v1.0 is pushed, or
#   - Actions -> "Build WinDirStat (Cyberpunk)" -> Run workflow is started with a version filled in.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, e.g. v1.0 (leave empty to only build)'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v3

      # Release builds know their version; it powers the title bar and the update check
      - name: Stamp release version
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          Set-Content -Path windirstat/CyberVersion.h -Encoding utf8 -Value @(
            '#pragma once',
            "#define CYBERDIRSTAT_VERSION L`"$env:RELEASE_TAG`""
          )
          Get-Content windirstat/CyberVersion.h

      - name: Build
        shell: cmd
        run: msbuild windirstat.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /t:windirstat

      - uses: actions/upload-artifact@v7
        with:
          name: WinDirStat-Cyberpunk-${{ matrix.platform }}
          path: build/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Prepare exe files
        run: |
          # Plain .exe assets: download and run, nothing to unpack.
          # No version in the name: in portable mode the settings file is named after the exe.
          mkdir -p release
          cp dist/WinDirStat-Cyberpunk-x64/*.exe   release/CyberDirStat-x64.exe
          cp dist/WinDirStat-Cyberpunk-Win32/*.exe release/CyberDirStat-x86.exe
          ls -la release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists (e.g. re-run): replace the files, drop old zip packages
            gh release upload "$TAG" release/*.exe --clobber
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep '\.zip$' || true); do
              gh release delete-asset "$TAG" "$asset" --yes
            done
          else
            # Creates the tag on the built commit if it does not exist yet
            gh release create "$TAG" release/*.exe \
              --target "$GITHUB_SHA" \
              --title "CyberDirStat $TAG" \
              --generate-notes
          fi
